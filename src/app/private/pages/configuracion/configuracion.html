<div class="max-w-3xl mx-auto bg-white shadow-lg rounded-2xl p-8 border border-gray-100">
  <h2 class="text-2xl font-bold text-blue-800 mb-1">Actualizar Información</h2>
  <p class="text-gray-500 text-sm mb-8">Verifica y actualiza tus datos personales y académicos.</p>

  <form [formGroup]="userForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Código Universitario</label>
      <input
        type="text"
        formControlName="codigoUniversitario"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Tipo Documento</label>
      <select
        formControlName="tipoDocumento"
        class="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      >
        <option value="">Seleccione...</option>
        <option value="D">DNI</option>
        <option value="C">Carnet de Extranjería</option>
        <option value="P">Pasaporte</option>
        <option value="N">Partida de Nacimiento</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Número Documento</label>
      <input
        type="text"
        formControlName="numeroDocumento"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Nombre</label>
      <input
        type="text"
        formControlName="nombre"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Apellido Paterno</label>
      <input
        type="text"
        formControlName="apellidoPaterno"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Apellido Materno</label>
      <input
        type="text"
        formControlName="apellidoMaterno"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Correo</label>
      <input
        type="email"
        formControlName="correo"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Teléfono</label>
      <input
        type="text"
        formControlName="telefono"
        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Facultad</label>
      <select
        formControlName="nombreFacultad"
        (change)="ObtenerEscuelasPorFacultad($event)"
        class="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      >
        <option value="0">Seleccione...</option>
        <option *ngFor="let facultad of facultades" [value]="facultad.id">
          {{ facultad.nombre }}
        </option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700">Escuela</label>
      <select
        formControlName="nombreEscuela"
        class="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 transition"
      >
        <option value="0">Seleccione...</option>
        <option *ngFor="let escuela of escuelas" [value]="escuela.id">
          {{ escuela.nombre }}
        </option>
      </select>
    </div>

    <div class="md:col-span-2 flex justify-end pt-4 border-t border-gray-100 mt-2">
      <button
        type="button"
        (click)="ActualizarInformacion()"
        class="bg-blue-800 hover:bg-blue-900 active:bg-blue-950 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-300"
      >
        Guardar cambios
      </button>
    </div>
  </form>
</div>
