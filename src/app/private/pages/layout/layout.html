<div class="layout-container">

  <aside class="sidebar" [class.hidden]="!sidebarOpen">
    <h2>Menú</h2>
    <ul>
      <li *ngFor="let menu of usuarioLogeado.menus">
        <a href="/intranet/{{ menu.ruta }}">{{ menu.nombre }}</a>
      </li>
    </ul>
  </aside>

  <div class="overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <div class="main">
    <nav class="navbar">
      <button class="menu-btn" (click)="toggleSidebar()" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>

      <h1>Karify - Sistema de Detección de Plagio</h1>

      <div class="user-menu">
        <button class="user-btn" (click)="toggleUserMenu()" aria-label="Menú de usuario">
          <img src="UsuarioPorDefecto.png" alt="Usuario" class="user-avatar" />
        </button>

        <div class="user-dropdown" *ngIf="userMenuOpen">
          <div class="user-info">
            <img src="UsuarioPorDefecto.png" alt="Usuario" class="user-avatar-large" />
            <div>
              <p class="user-fullname">
                {{ usuarioLogeado.nombre }} {{ usuarioLogeado.apellidoPaterno }}
                {{ usuarioLogeado.apellidoMaterno }}
              </p>
              <p class="user-role">{{ usuarioLogeado.rol }}</p>
            </div>
          </div>
          <button class="logout-btn" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
          </button>
        </div>
      </div>
    </nav>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
