<div class="min-h-screen bg-gray-100 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">

        <div class="mb-6 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-bold text-green-800">Gestión de Roles</h1>
            <p class="text-gray-500 text-sm md:text-base">
                Administra los roles y permisos de usuarios registrados en el sistema.
            </p>
        </div>

        <div
            class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex w-full md:w-auto">
                <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar rol..."
                    class="w-full md:w-140 px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-green-800 focus:outline-none" />
                <button (click)="buscar()" class="px-4 md:px-6 py-2 text-white rounded-r-lg transition hover:opacity-90"
                    style="background-color:#006400">
                    Buscar
                </button>
            </div>

            <button
                class="w-full md:w-auto px-5 py-2 text-white rounded-lg shadow-sm transition flex items-center justify-center gap-2 hover:opacity-90"
                style="background-color:#006400" (click)="abrirModal()">
                Agregar <i class="bi bi-plus-lg text-lg"></i>
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">

            <div class="hidden md:block overflow-x-auto">
                <table class="min-w-full">
                    <thead class="text-white text-sm text-center" style="background-color:#006400">
                        <tr>
                            <th class="px-6 py-3">ID</th>
                            <th class="px-6 py-3">Nombre</th>
                            <th class="px-6 py-3">Acciones</th>
                        </tr>
                    </thead>

                    <tbody class="divide-y text-center">
                        <tr *ngFor="let usuario of rolesPaginados" class="hover:bg-gray-50 transition">

                            <td class="px-6 py-4 text-sm text-gray-600">
                                #{{usuario.id}}
                            </td>

                            <td class="px-6 py-4 font-medium text-gray-800">
                                {{usuario.nombre}}
                            </td>

                            <td class="px-6 py-4">
                                <div class="flex items-center justify-center gap-3">

                                    <button (click)="editar(usuario)"
                                        class="w-10 h-10 flex items-center justify-center rounded-full text-white shadow-sm transition transform hover:scale-110 hover:shadow-md"
                                        style="background-color:#006400">
                                        <i class="bi bi-pencil-square text-lg"></i>
                                    </button>

                                    <button (click)="asignarPermisos(usuario)"
                                        class="w-10 h-10 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-700 shadow-sm transition transform hover:scale-110 hover:bg-emerald-200 hover:shadow-md">
                                        <i class="bi bi-shield-lock-fill text-lg"></i>
                                    </button>

                                    <button (click)="eliminar(usuario)"
                                        class="w-10 h-10 flex items-center justify-center rounded-full bg-red-100 text-red-600 shadow-sm transition transform hover:scale-110 hover:bg-red-200 hover:shadow-md">
                                        <i class="bi bi-trash3 text-lg"></i>
                                    </button>

                                </div>
                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="md:hidden divide-y">
                <div *ngFor="let usuario of rolesPaginados" class="p-4 bg-white hover:bg-gray-50 transition">

                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">ID #{{usuario.id}}</p>
                            <p class="font-semibold text-gray-800 text-base">
                                {{usuario.nombre}}
                            </p>
                        </div>

                        <button class="p-2 rounded-full hover:bg-gray-100 transition">
                            <i class="bi bi-three-dots-vertical text-gray-600 text-lg"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between mt-4">

                        <button (click)="editar(usuario)"
                            class="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm shadow-sm transition hover:opacity-90"
                            style="background-color:#006400">
                            <i class="bi bi-pencil-square text-lg"></i>
                            Editar
                        </button>

                        <div class="flex items-center gap-2">

                            <button (click)="asignarPermisos(usuario)"
                                class="w-10 h-10 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-700 transition transform hover:scale-110 hover:bg-emerald-200">
                                <i class="bi bi-shield-lock-fill text-lg"></i>
                            </button>

                            <button (click)="eliminar(usuario)"
                                class="w-10 h-10 flex items-center justify-center rounded-full bg-red-100 text-red-600 transition transform hover:scale-110 hover:bg-red-200">
                                <i class="bi bi-trash3 text-lg"></i>
                            </button>

                        </div>

                    </div>

                </div>
            </div>

        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-3">

            <button (click)="paginaAnterior()" [disabled]="paginaActual === 1"
                class="w-full md:w-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg disabled:opacity-50 transition">
                ← Anterior
            </button>

            <span class="text-gray-600 text-sm md:text-base">
                Página {{paginaActual}} de {{totalPaginas}}
            </span>

            <button (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas"
                class="w-full md:w-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg disabled:opacity-50 transition">
                Siguiente →
            </button>

        </div>

    </div>
</div>

<div *ngIf="isModalOpen"
     class="fixed inset-0 z-50 flex items-center justify-center">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       (click)="cerrarModal()"></div>

  <!-- Modal -->
  <div class="relative bg-white w-full max-w-md mx-4 rounded-2xl shadow-xl p-6 animate-fade-in">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-800">Nuevo Rol</h2>
      <button (click)="cerrarModal()" class="text-gray-400 hover:text-gray-600">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Nombre del rol</label>
        <input 
          type="text"
          [(ngModel)]="agregarRol.nombre"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800 focus:outline-none"
          placeholder="Ej: Administrador"
        />
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">

      <button 
        (click)="cerrarModal()"
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition">
        Cancelar
      </button>

      <button 
        (click)="guardarRol()"
        class="px-4 py-2 text-white rounded-lg transition hover:opacity-90"
        style="background-color:#006400">
        Guardar
      </button>

    </div>

  </div>
</div>
