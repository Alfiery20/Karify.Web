<div class="min-h-screen bg-gray-50 p-6 md:p-10">
  <div class="max-w-7xl mx-auto">
    <div class="mb-8 text-center md:text-left">
      <h1 class="text-3xl md:text-4xl font-bold text-green-900 tracking-tight">Gestión de Roles</h1>
      <p class="text-gray-600 text-base mt-2">
        Administra los roles y permisos de usuarios registrados en el sistema.
      </p>
    </div>

    <div
      class="bg-white rounded-xl shadow-md p-5 mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4"
    >
      <div class="flex w-full md:w-auto">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Buscar rol..."
          class="w-full md:w-80 px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-green-800 focus:outline-none"
        />
        <button
          (click)="buscar()"
          class="cursor-pointer px-5 py-2 text-white font-medium rounded-r-lg transition hover:opacity-90"
          style="background-color: #006400"
        >
          Buscar
        </button>
      </div>

      <button
        (click)="abrirModal()"
        class="cursor-pointer w-full md:w-auto px-6 py-2 text-white font-medium rounded-lg shadow-md transition flex items-center justify-center gap-2 hover:opacity-90"
        style="background-color: #006400"
      >
        <i class="bi bi-plus-lg text-lg"></i> Nuevo Rol
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
        <table class="min-w-full text-sm">
          <thead class="text-white" style="background-color: #006400">
            <tr>
              <th class="px-6 py-3 text-center">ID</th>
              <th class="px-6 py-3 text-center">Nombre</th>
              <th class="px-6 py-3 text-center">Estado</th>
              <th class="px-6 py-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <tr *ngFor="let rol of rolesPaginados" class="hover:bg-gray-50 transition">
              <td class="px-6 py-4 text-gray-600 text-center">#{{ rol.id }}</td>
              <td class="px-6 py-4 font-medium text-gray-800 text-center">{{ rol.nombre }}</td>
              <td class="px-6 py-4 font-medium text-gray-800 text-center">
                {{ rol.estado ? 'Activo' : 'Inactivo' }}
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center justify-center gap-3">
                  <button
                    (click)="verRol(rol.id)"
                    class="w-10 h-10 flex items-center justify-center rounded-full text-white shadow-md transition transform hover:scale-110 hover:shadow-lg"
                    style="background-color: #006400"
                  >
                    <i class="bi bi-pencil text-base"></i>
                  </button>
                  <button
                    (click)="eliminarRol(rol)"
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-red-100 text-red-600 shadow-md transition transform hover:scale-110 hover:bg-red-200 hover:shadow-lg"
                  >
                    <ng-container *ngIf="rol.estado; else iconoAlternativo">
                      <i class="bi bi-trash text-base text-red-600"></i>
                    </ng-container>
                    <ng-template #iconoAlternativo>
                      <i class="bi bi-arrow-counterclockwise text-base text-gray-600"></i>
                    </ng-template>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-3">
      <button
        (click)="paginaAnterior()"
        [disabled]="paginaActual === 1"
        class="cursor-pointer w-full md:w-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg disabled:opacity-50 transition"
      >
        ← Anterior
      </button>
      <span class="text-gray-600">Página {{ paginaActual }} de {{ totalPaginas }}</span>
      <button
        (click)="paginaSiguiente()"
        [disabled]="paginaActual === totalPaginas"
        class="cursor-pointer w-full md:w-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg disabled:opacity-50 transition"
      >
        Siguiente →
      </button>
    </div>
  </div>
</div>

<!-- Modal de Edición -->
<div *ngIf="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="cerrarModal()"></div>
  <div
    class="relative bg-white w-full max-w-md mx-4 rounded-2xl shadow-xl p-6 animate-fade-in max-h-[90vh] overflow-y-auto"
  >
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-800">Editar Rol</h2>
      <button (click)="cerrarModal()" class="text-gray-400 hover:text-gray-600">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Nombre del rol</label>
        <input
          type="text"
          [(ngModel)]="rolSeleccionado.nombre"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800 focus:outline-none"
          placeholder="Ej: Administrador"
        />
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-2">Permisos</label>
        <div class="space-y-3">
          <div
            *ngFor="let permiso of rolSeleccionado.permisos"
            class="flex items-center justify-between"
          >
            <span class="text-gray-700 text-sm">{{ permiso.ruta }}</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" [(ngModel)]="permiso.isPermiso" class="sr-only peer" />
              <div
                class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-green-800 transition-colors"
              ></div>
              <div
                class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-md transform peer-checked:translate-x-5 transition-transform"
              ></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="cerrarModal()"
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition"
      >
        Cancelar
      </button>
      <button
        (click)="guardarRol()"
        class="px-4 py-2 text-white rounded-lg transition hover:opacity-90"
        style="background-color: #006400"
      >
        Guardar
      </button>
    </div>
  </div>
</div>
