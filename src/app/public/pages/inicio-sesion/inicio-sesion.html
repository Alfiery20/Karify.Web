<div
  class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 px-4"
>
  <div
    class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-lg text-center border-t-8 border-blue-800"
  >
    <img src="Login/Escudo_UNPRG.webp" alt="Logo UNPRG" width="112" height="112" class="mx-auto mb-6 w-28" />

    <h1 class="text-2xl font-bold text-blue-800 mb-2 leading-snug">
      Universidad Nacional Pedro Ruiz Gallo
    </h1>
    <p class="text-yellow-600 font-semibold mb-1 uppercase text-sm tracking-wide">
      Sistema de Análisis de No Plagio
    </p>
    <div class="w-12 h-1 bg-yellow-500 mx-auto rounded-full mb-6"></div>

    <p class="text-gray-600 mb-8 leading-relaxed">
      Plataforma institucional para garantizar la originalidad en los trabajos de investigación.
    </p>

    <button
      (click)="loginWithGoogle()"
      class="flex items-center justify-center w-full bg-blue-800 hover:bg-blue-900 active:bg-blue-950 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 ease-in-out"
    >
      <svg class="w-6 h-6 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path
          fill="#EA4335"
          d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.9 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.1 13.1 17.6 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3.1-2.4 5.7-5.1 7.5l7.9 6.1c4.6-4.2 7.3-10.3 7.3-18.1z"
        />
        <path
          fill="#FBBC05"
          d="M10.4 28.4c-1.1-3.1-1.1-6.5 0-9.6l-7.9-6.1C.9 16.7 0 20.2 0 24c0 3.8.9 7.3 2.5 10.3l7.9-6z"
        />
        <path
          fill="#34A853"
          d="M24 48c6.2 0 11.5-2 15.3-5.4l-7.9-6.1c-2.2 1.5-5 2.4-7.4 2.4-6.4 0-11.9-4.3-13.9-10.2l-7.9 6.1C6.4 42.6 14.6 48 24 48z"
        />
      </svg>
      Iniciar sesión con Google
    </button>

    <p class="text-gray-400 text-xs mt-6">Acceso exclusivo para la comunidad universitaria UNPRG</p>
  </div>
</div>
